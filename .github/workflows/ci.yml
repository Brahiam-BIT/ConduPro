name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: condupro
          POSTGRES_USER: condupro
          POSTGRES_PASSWORD: condupro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U condupro -d condupro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: condupro
      DATABASE_USER: condupro
      DATABASE_PASSWORD: condupro
      JWT_SECRET: ci-jwt-secret-key-minimum-32-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-key-minimum-32-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --passWithNoTests

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
