# En producción usa también docker-compose.prod.yml para bind 127.0.0.1:5432.
services:
  postgres:
    image: postgres:16-alpine
    container_name: condupro-postgres
    restart: unless-stopped
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-condupro}
      POSTGRES_USER: ${DATABASE_USER:-condupro}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-condupro}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - condupro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-condupro} -d ${DATABASE_NAME:-condupro}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - condupro-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: condupro-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@condupro.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - condupro_pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - condupro-net

volumes:
  condupro_pgdata:
    name: condupro_pgdata
  condupro_pgadmin:
    name: condupro_pgadmin

networks:
  condupro-net:
    name: condupro-net
    driver: bridge
